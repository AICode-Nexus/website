name: Auto Article Generation

on:
  schedule:
    - cron: '0 3 * * 3,6'
  workflow_dispatch:
    inputs:
      date:
        description: 'Reference date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          run_date="${{ github.event.inputs.date }}"

          if [ -z "$run_date" ]; then
            run_date="$(date +%F)"
          fi

          npm run generate:article -- --date="$run_date"

      - name: Validate content quality
        run: npm run check:content

      - name: Validate IA model
        run: npm run check:ia

      - name: Build website
        run: npm run build

      - name: Commit generated article
        run: |
          git add docs/ logs/

          if git diff --cached --quiet; then
            echo "No article changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(auto): generate knowledge article $(date +%F)"
          git push origin "HEAD:${{ github.ref_name || github.event.repository.default_branch }}"
