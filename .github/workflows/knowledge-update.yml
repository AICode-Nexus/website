name: Knowledge Base Update

on:
  schedule:
    - cron: '0 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Monitor tool releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run monitor:tool-releases

      - name: Detect stale docs
        run: npm run detect:stale-docs

      - name: Update stale docs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run update:stale-doc

      - name: Validate content quality
        run: npm run check:content

      - name: Validate IA model
        run: npm run check:ia

      - name: Build website
        run: npm run build

      - name: Commit updates
        run: |
          git add docs/ content-sources/ logs/ src/data/

          if git diff --cached --quiet; then
            echo "No knowledge base changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(auto): update knowledge base $(date +%F)"
          git push origin "HEAD:${{ github.ref_name || github.event.repository.default_branch }}"
