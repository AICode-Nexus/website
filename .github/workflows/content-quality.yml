name: Content Quality

on:
  pull_request:
  push:
    branches: ["main", "development"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Verify generated handbook docs
        run: npm run check:handbooks

      - name: Validate IA model
        run: npm run check:ia

      - name: Validate content quality
        run: npm run check:content

      - name: Test teaching video scraper
        run: npm run test:teaching-videos

      - name: Validate teaching video catalog
        run: npm run check:teaching-videos

      - name: Build website
        run: npm run build
