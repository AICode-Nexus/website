name: Daily Brief Draft

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Daily brief date (YYYY-MM-DD)'
        required: false
        default: ''
      slug:
        description: 'Draft slug'
        required: false
        default: 'ai-coding-daily-draft'
      title:
        description: 'Draft topic title'
        required: false
        default: '待确认主题'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate daily brief draft
        run: |
          run_date="${{ github.event.inputs.date }}"
          run_slug="${{ github.event.inputs.slug }}"
          run_title="${{ github.event.inputs.title }}"

          if [ -z "$run_date" ]; then
            run_date="$(date +%F)"
          fi

          if [ -z "$run_slug" ]; then
            run_slug="ai-coding-daily-draft"
          fi

          if [ -z "$run_title" ]; then
            run_title="待确认主题"
          fi

          echo "RUN_DATE=$run_date" >> "$GITHUB_ENV"
          echo "RUN_SLUG=$run_slug" >> "$GITHUB_ENV"
          npm run generate:daily-brief -- --date="$run_date" --slug="$run_slug" --title="$run_title"

      - name: Build website
        run: npm run build

      - name: Commit generated draft
        run: |
          git add content-sources/daily blog/daily

          if git diff --cached --quiet; then
            echo "No daily brief changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(daily): generate ${{ env.RUN_DATE }} draft"
          git push origin "HEAD:${{ github.ref_name || github.event.repository.default_branch }}"
