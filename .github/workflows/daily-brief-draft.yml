name: Daily Brief Draft

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Daily brief date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish daily brief
        run: |
          run_date="${{ github.event.inputs.date }}"

          if [ -z "$run_date" ]; then
            run_date="$(date +%F)"
          fi

          echo "RUN_DATE=$run_date" >> "$GITHUB_ENV"
          npm run generate:daily-brief:auto -- --date="$run_date"

      - name: Build website
        run: npm run build

      - name: Commit generated brief
        run: |
          git add content-sources/daily blog/daily

          if git diff --cached --quiet; then
            echo "No daily brief changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(daily): publish ${{ env.RUN_DATE }} brief"
          git push origin "HEAD:${{ github.ref_name || github.event.repository.default_branch }}"
