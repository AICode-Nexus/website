name: Teaching Videos Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Sync teaching video catalog
        run: npm run sync:teaching-videos

      - name: Test teaching video pipeline
        run: npm run test:teaching-videos

      - name: Build website
        run: npm run build

      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- src/data/teachingVideos.generated.json; then
            echo "No catalog changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teachingVideos.generated.json
          git commit -m "data(videos): refresh teaching video catalog"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
