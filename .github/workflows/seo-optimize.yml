name: SEO Optimization Loop

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Fetch GA4 metrics
        env:
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: npm run analytics:fetch

      - name: Evaluate active experiments
        run: npm run analytics:evaluate

      - name: Run SEO experiment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run analytics:seo-experiment

      - name: Analyze content gaps
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run analytics:content-gaps

      - name: Validate content quality
        run: npm run check:content

      - name: Build website
        run: npm run build

      - name: Commit SEO changes
        run: |
          git add docs/ content-sources/ logs/

          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(seo): optimization cycle $(date +%F)"
          git push origin "HEAD:${{ github.ref_name || github.event.repository.default_branch }}"
