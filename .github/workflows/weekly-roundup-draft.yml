name: Weekly Roundup Draft

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      week_ending:
        description: 'Week ending date (YYYY-MM-DD)'
        required: false
        default: ''
      slug:
        description: 'Roundup slug'
        required: false
        default: 'weekly-roundup'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly roundup draft
        run: |
          week_ending="${{ github.event.inputs.week_ending }}"
          roundup_slug="${{ github.event.inputs.slug }}"

          if [ -z "$week_ending" ]; then
            week_ending="$(date +%F)"
          fi

          if [ -z "$roundup_slug" ]; then
            roundup_slug="weekly-roundup"
          fi

          echo "WEEK_ENDING=$week_ending" >> "$GITHUB_ENV"
          npm run generate:weekly-roundup -- --week-ending="$week_ending" --slug="$roundup_slug"

      - name: Build website
        run: npm run build

      - name: Commit generated draft
        run: |
          git add content-sources/weekly blog/weekly

          if git diff --cached --quiet; then
            echo "No weekly roundup changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(weekly): generate ${{ env.WEEK_ENDING }} roundup draft"
          git push origin "HEAD:${{ github.ref_name || github.event.repository.default_branch }}"
