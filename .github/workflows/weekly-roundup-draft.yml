name: Weekly Roundup Draft

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      week_ending:
        description: 'Week ending date (YYYY-MM-DD)'
        required: false
        default: ''
      slug:
        description: 'Roundup slug'
        required: false
        default: 'weekly-roundup'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly roundup draft
        run: |
          week_ending="${{ github.event.inputs.week_ending }}"
          roundup_slug="${{ github.event.inputs.slug }}"

          if [ -z "$week_ending" ]; then
            week_ending="$(date +%F)"
          fi

          if [ -z "$roundup_slug" ]; then
            roundup_slug="weekly-roundup"
          fi

          echo "WEEK_ENDING=$week_ending" >> "$GITHUB_ENV"
          npm run generate:weekly-roundup -- --week-ending="$week_ending" --slug="$roundup_slug"

      - name: Create draft PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(weekly): generate ${{ env.WEEK_ENDING }} roundup draft"
          branch: "automation/weekly-roundup-${{ env.WEEK_ENDING }}"
          title: "docs(weekly): generate ${{ env.WEEK_ENDING }} roundup draft"
          body: |
            Automated Weekly Roundup draft generated for week ending `${{ env.WEEK_ENDING }}`.

            - Manifest updated under `content-sources/weekly/`
            - Draft post generated under `blog/weekly/`
            - Draft remains unpublished until manually reviewed and merged
          add-paths: |
            content-sources/weekly/
            blog/weekly/
          labels: |
            automation
            weekly-roundup
          delete-branch: true
          draft: true
