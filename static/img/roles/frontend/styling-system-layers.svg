<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" fill="none">
  <rect width="1200" height="700" fill="#FAF7F1"/>
  <text x="72" y="84" fill="#17212B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="700">样式系统层级</text>
  <text x="72" y="120" fill="#606973" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">先定品牌和 token，再谈组件变体和页面氛围，避免默认模板感</text>

  <rect x="72" y="178" width="1056" height="112" rx="28" fill="#FFF0DE" stroke="#EDD1A8" stroke-width="2"/>
  <text x="108" y="244" fill="#8B531E" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">Brand Layer</text>
  <text x="360" y="244" fill="#6B4C2B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">品牌方向、主辅色、排版气质、禁用风格</text>

  <rect x="72" y="316" width="1056" height="112" rx="28" fill="#EAF2FF" stroke="#CCDCF7" stroke-width="2"/>
  <text x="108" y="382" fill="#1E4D88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">Token Layer</text>
  <text x="360" y="382" fill="#305880" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">语义颜色、间距尺度、圆角、阴影、字号与断点</text>

  <rect x="72" y="454" width="1056" height="112" rx="28" fill="#EAF6EE" stroke="#CCE5D2" stroke-width="2"/>
  <text x="108" y="520" fill="#25613B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">Component Layer</text>
  <text x="360" y="520" fill="#316042" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">按钮、卡片、表单、导航的变体和状态规则</text>

  <path d="M600 290V316" stroke="#C18749" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 428V454" stroke="#6794D1" stroke-width="4" stroke-linecap="round"/>

  <rect x="72" y="604" width="1056" height="56" rx="18" fill="#17212B"/>
  <text x="102" y="641" fill="#FFF8EF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">页面层不直接发明新风格，而是在已有 token 和变体之上组合出品牌化界面。</text>
</svg>
