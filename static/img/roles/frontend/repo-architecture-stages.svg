<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" fill="none">
  <rect width="1200" height="680" fill="#F8F7FC"/>
  <text x="72" y="84" fill="#17212B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="700">前端仓库结构演进</text>
  <text x="72" y="120" fill="#5D6672" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">不是越复杂越专业，而是复杂度要和共享资产、团队规模、验证成本匹配</text>

  <rect x="72" y="190" width="300" height="330" rx="28" fill="#EAF2FF" stroke="#CBDCF9" stroke-width="2"/>
  <text x="110" y="244" fill="#1E4D88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">单应用</text>
  <text x="110" y="300" fill="#2B537D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">一个 app</text>
  <text x="110" y="340" fill="#2B537D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">共享资产很薄</text>
  <text x="110" y="380" fill="#2B537D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">验证链单一</text>

  <rect x="450" y="150" width="300" height="370" rx="28" fill="#FFF3E1" stroke="#EDD1A8" stroke-width="2"/>
  <text x="488" y="204" fill="#8B531E" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">pnpm workspace</text>
  <text x="488" y="260" fill="#6D4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">多个 apps / packages</text>
  <text x="488" y="300" fill="#6D4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">共享 UI / token</text>
  <text x="488" y="340" fill="#6D4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">根命令统一验证</text>

  <rect x="828" y="110" width="300" height="410" rx="28" fill="#EAF6EE" stroke="#CDE4D3" stroke-width="2"/>
  <text x="866" y="164" fill="#25613B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">Monorepo</text>
  <text x="866" y="220" fill="#316042" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">多产品、多共享包</text>
  <text x="866" y="260" fill="#316042" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">任务编排与缓存</text>
  <text x="866" y="300" fill="#316042" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">强规则与强验证</text>

  <path d="M372 355H450" stroke="#7597D4" stroke-width="4" stroke-linecap="round"/>
  <path d="M750 335H828" stroke="#C89152" stroke-width="4" stroke-linecap="round"/>

  <text x="72" y="608" fill="#5D6672" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">先看共享资产和验证复杂度，再决定是否升级结构。不要让架构复杂度跑在团队能力前面。</text>
</svg>
