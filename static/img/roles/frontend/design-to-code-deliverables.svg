<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" fill="#FBF8F1"/>
  <text x="72" y="84" fill="#17212B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="700">设计到代码交付物板</text>
  <text x="72" y="122" fill="#5E6671" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">把输入、骨架、状态和验证拆成独立制品，避免一次性赌最终页面</text>

  <rect x="72" y="176" width="240" height="420" rx="28" fill="#FFF3E2" stroke="#E8CDA9" stroke-width="2"/>
  <text x="108" y="228" fill="#8B4E1B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">输入包</text>
  <text x="108" y="282" fill="#6C4B2A" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">Figma 节点</text>
  <text x="108" y="322" fill="#6C4B2A" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">token 清单</text>
  <text x="108" y="362" fill="#6C4B2A" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">断点与状态</text>
  <text x="108" y="402" fill="#6C4B2A" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">截图与标注</text>
  <text x="108" y="468" fill="#8B4E1B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">目标：让 AI 理解</text>
  <text x="108" y="500" fill="#8B4E1B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">页面结构与边界</text>

  <rect x="348" y="176" width="240" height="420" rx="28" fill="#EAF3FF" stroke="#C8DCF9" stroke-width="2"/>
  <text x="384" y="228" fill="#1E4D88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">骨架稿</text>
  <text x="384" y="282" fill="#27507F" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">区块拆分表</text>
  <text x="384" y="322" fill="#27507F" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">组件层级图</text>
  <text x="384" y="362" fill="#27507F" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">页面私有 / 共享</text>
  <text x="384" y="402" fill="#27507F" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">静态内容骨架</text>
  <text x="384" y="468" fill="#1E4D88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">目标：先交付可以</text>
  <text x="384" y="500" fill="#1E4D88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">评审的结构版本</text>

  <rect x="624" y="176" width="240" height="420" rx="28" fill="#ECF8EE" stroke="#CDE6D3" stroke-width="2"/>
  <text x="660" y="228" fill="#24613B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">状态稿</text>
  <text x="660" y="282" fill="#2F6040" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">hover / focus</text>
  <text x="660" y="322" fill="#2F6040" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">loading / empty</text>
  <text x="660" y="362" fill="#2F6040" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">error / success</text>
  <text x="660" y="402" fill="#2F6040" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">mobile / desktop</text>
  <text x="660" y="468" fill="#24613B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">目标：把返工高发区</text>
  <text x="660" y="500" fill="#24613B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">前移到实现阶段</text>

  <rect x="900" y="176" width="228" height="420" rx="28" fill="#F6EDF9" stroke="#E3D1EC" stroke-width="2"/>
  <text x="936" y="228" fill="#6D367D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">验证包</text>
  <text x="936" y="282" fill="#6D4A74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">断点截图</text>
  <text x="936" y="322" fill="#6D4A74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">关键交互录屏</text>
  <text x="936" y="362" fill="#6D4A74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">验证命令</text>
  <text x="936" y="402" fill="#6D4A74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">风险与差异</text>
  <text x="936" y="468" fill="#6D367D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">目标：让设计、前端、</text>
  <text x="936" y="500" fill="#6D367D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">review 用同一套证据</text>

  <path d="M312 386H348" stroke="#D49B51" stroke-width="4" stroke-linecap="round"/>
  <path d="M588 386H624" stroke="#739BD7" stroke-width="4" stroke-linecap="round"/>
  <path d="M864 386H900" stroke="#5FA076" stroke-width="4" stroke-linecap="round"/>

  <rect x="72" y="636" width="1056" height="44" rx="16" fill="#17212B"/>
  <text x="102" y="665" fill="#FFF9F2" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">最容易失控的地方：把“输入包 + 骨架 + 状态 + 验证”压缩成一句“按设计稿实现”。</text>
</svg>
