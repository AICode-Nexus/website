  <text x="108" y="402" fill="#2B537D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">build</text>

  <rect x="348" y="176" width="240" height="400" rx="28" fill="#FFF3E1" stroke="#EDD1A8" stroke-width="2"/>
