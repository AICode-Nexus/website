  <text x="384" y="362" fill="#6D4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">视觉差异备注</text>
  <text x="384" y="402" fill="#6D4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">录屏或 GIF</text>

  <rect x="624" y="176" width="240" height="400" rx="28" fill="#EAF6EE" stroke="#CDE4D3" stroke-width="2"/>
