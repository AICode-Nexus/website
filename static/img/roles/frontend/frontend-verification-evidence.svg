  <rect x="72" y="620" width="1056" height="44" rx="16" fill="#17212B"/>
  <text x="116" y="649" fill="#FFF8EF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">没有证据包，AI 产出就只能停留在“看上去差不多”；有证据包，团队才能把验证复用成流程资产。</text>
