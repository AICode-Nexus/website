  <text x="72" y="122" fill="#5F6872" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">代码可运行只是起点，真正能交付的是“命令 + 截图 + 录屏 + 风险说明”的组合证据</text>

  <rect x="72" y="176" width="240" height="400" rx="28" fill="#EAF2FF" stroke="#C9DBF9" stroke-width="2"/>
