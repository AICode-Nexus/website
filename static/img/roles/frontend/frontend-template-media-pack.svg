<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" fill="#F7F8FC"/>
  <text x="72" y="84" fill="#17212B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="700">前端模板资产包</text>
  <text x="72" y="122" fill="#5D6673" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">让 brief、证据清单、PR 摘要和回滚入口一起出现，handoff 才不会在聊天记录里断掉</text>

  <rect x="84" y="176" width="228" height="420" rx="28" fill="#EAF2FF" stroke="#CBDBF8" stroke-width="2"/>
  <text x="118" y="228" fill="#1E4D88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">Task Brief</text>
  <text x="118" y="280" fill="#2A507D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">目标</text>
  <text x="118" y="316" fill="#2A507D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">范围</text>
  <text x="118" y="352" fill="#2A507D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">设计输入</text>
  <text x="118" y="388" fill="#2A507D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">验收条件</text>
  <text x="118" y="424" fill="#2A507D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">截图要求</text>

  <rect x="336" y="176" width="228" height="420" rx="28" fill="#ECF8EE" stroke="#CFE5D4" stroke-width="2"/>
  <text x="370" y="228" fill="#25613B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">Evidence</text>
  <text x="370" y="280" fill="#2E6140" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">桌面截图</text>
  <text x="370" y="316" fill="#2E6140" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">移动截图</text>
  <text x="370" y="352" fill="#2E6140" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">15 秒录屏</text>
  <text x="370" y="388" fill="#2E6140" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">命令结果</text>
  <text x="370" y="424" fill="#2E6140" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">风险说明</text>

  <rect x="588" y="176" width="228" height="420" rx="28" fill="#FFF3E1" stroke="#EDD0A8" stroke-width="2"/>
  <text x="622" y="228" fill="#8B531E" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">PR Summary</text>
  <text x="622" y="280" fill="#6C4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">改了什么</text>
  <text x="622" y="316" fill="#6C4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">为什么现在改</text>
  <text x="622" y="352" fill="#6C4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">影响到哪里</text>
  <text x="622" y="388" fill="#6C4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">哪些没覆盖</text>
  <text x="622" y="424" fill="#6C4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">谁继续接手</text>

  <rect x="840" y="176" width="276" height="420" rx="28" fill="#FDEBF1" stroke="#E5C7D2" stroke-width="2"/>
  <text x="874" y="228" fill="#8D3C58" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">Rollback / Next</text>
  <text x="874" y="280" fill="#7C4358" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">回滚入口</text>
  <text x="874" y="316" fill="#7C4358" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">排查入口</text>
  <text x="874" y="352" fill="#7C4358" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">上线后观察项</text>
  <text x="874" y="388" fill="#7C4358" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">下一个接手动作</text>
  <text x="874" y="424" fill="#7C4358" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">补充素材位置</text>

  <rect x="72" y="636" width="1056" height="44" rx="16" fill="#17212B"/>
  <text x="116" y="665" fill="#FFF8EF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">模板资产的目标不是“写得好看”，而是让任何接手人都能快速知道：任务是什么、证据在哪、还剩什么风险。</text>
</svg>
