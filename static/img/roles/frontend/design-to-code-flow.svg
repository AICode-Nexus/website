  <text x="108" y="594" fill="#FFF9F2" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">输出顺序：页面骨架 -> 组件拆分 -> 状态补齐 -> 响应式修整，不要直接赌“最终代码一次成型”。</text>
