<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" fill="#F6F9FC"/>
  <text x="72" y="84" fill="#17212B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="700">仓库合同分层</text>
  <text x="72" y="122" fill="#5F6872" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">把 app、feature、package、tooling 和 release artifact 的责任写清楚，AI 才不会在错误目录里做正确事情</text>

  <rect x="72" y="176" width="1056" height="104" rx="28" fill="#EAF2FF" stroke="#C9DBF9" stroke-width="2"/>
  <text x="108" y="240" fill="#1E4D88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">App Layer</text>
  <text x="316" y="240" fill="#2B537D" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">页面路由、页面私有组件、业务配置、页面级测试</text>

  <rect x="72" y="308" width="1056" height="104" rx="28" fill="#FFF3E1" stroke="#EDD1A8" stroke-width="2"/>
  <text x="108" y="372" fill="#8B531E" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">Package Layer</text>
  <text x="372" y="372" fill="#6D4D2C" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">共享 UI、tokens、config、hooks、SDK 与可复用逻辑</text>

  <rect x="72" y="440" width="1056" height="104" rx="28" fill="#EAF6EE" stroke="#CDE4D3" stroke-width="2"/>
  <text x="108" y="504" fill="#25613B" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">Tooling Layer</text>
  <text x="348" y="504" fill="#316042" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">lint、typecheck、build、generator、脚本、CI 任务与工作区编排</text>

  <rect x="72" y="572" width="1056" height="76" rx="24" fill="#17212B"/>
  <text x="108" y="620" fill="#FFF8EF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">Release Artifact：PR 描述、截图、录屏、变更说明、构建产物和回归证据应位于可追踪目录或自动化输出中。</text>
</svg>
