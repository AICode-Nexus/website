  <path d="M300 274H340" stroke="#8EA39A" stroke-width="4" stroke-linecap="round"/>
  <path d="M560 274H600" stroke="#8EA39A" stroke-width="4" stroke-linecap="round"/>
  <path d="M820 274H860" stroke="#8EA39A" stroke-width="4" stroke-linecap="round"/>
