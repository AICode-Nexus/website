  <text x="116" y="462" fill="#F8FFFC" font-family="Arial, sans-serif" font-size="24" font-weight="700">示例任务</text>
  <text x="116" y="504" fill="#F8FFFC" font-family="Arial, sans-serif" font-size="20">billing-worker 升级到 HPA：先定义边界，再写 rollout / rollback，收口 lag、error log、dashboard 证据，最后交给 oncall。</text>
  <text x="116" y="544" fill="#BED2C7" font-family="Arial, sans-serif" font-size="18">配套入口：Local -&gt; Background -&gt; Cloud / VS Code Agents 本地到后台交接案例</text>
