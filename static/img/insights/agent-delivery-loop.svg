<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent delivery loop</title>
  <desc id="desc">Closed loop diagram showing goal, parse, plan, act, verify, and either output or retry with correction.</desc>
  <defs>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#355EAF"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .body { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .arrow { stroke: #355EAF; stroke-width: 4; fill: none; marker-end: url(#arrow3); }
    </style>
  </defs>

  <rect x="40" y="40" width="1120" height="540" rx="36" fill="#F8FBFF"/>
  <text x="100" y="118" class="title">Agent delivery loop</text>
  <text x="100" y="150" class="subtitle">Production agents win by closing the loop, not by answering once.</text>

  <rect x="78" y="252" width="150" height="96" rx="22" fill="#FFF8E8" stroke="#D89A2E" stroke-width="2"/>
  <text x="153" y="292" text-anchor="middle" class="label">Goal</text>
  <text x="153" y="320" text-anchor="middle" class="body">User asks</text>

  <rect x="274" y="252" width="150" height="96" rx="22" fill="#EAF3FF" stroke="#5B8BD8" stroke-width="2"/>
  <text x="349" y="292" text-anchor="middle" class="label">Parse</text>
  <text x="349" y="320" text-anchor="middle" class="body">Scope + constraints</text>

  <rect x="470" y="252" width="150" height="96" rx="22" fill="#EEFDF4" stroke="#41A66E" stroke-width="2"/>
  <text x="545" y="292" text-anchor="middle" class="label">Plan</text>
  <text x="545" y="320" text-anchor="middle" class="body">Steps + tool choice</text>

  <rect x="666" y="252" width="150" height="96" rx="22" fill="#F5F3FF" stroke="#8572D6" stroke-width="2"/>
  <text x="741" y="292" text-anchor="middle" class="label">Act</text>
  <text x="741" y="320" text-anchor="middle" class="body">Execute tools</text>

  <rect x="862" y="252" width="170" height="96" rx="22" fill="#FFF3F2" stroke="#D56D62" stroke-width="2"/>
  <text x="947" y="292" text-anchor="middle" class="label">Verify</text>
  <text x="947" y="320" text-anchor="middle" class="body">Check evidence</text>

  <path d="M228 300H264" class="arrow"/>
  <path d="M424 300H460" class="arrow"/>
  <path d="M620 300H656" class="arrow"/>
  <path d="M816 300H852" class="arrow"/>

  <polygon points="950,414 1040,468 950,522 860,468" fill="#FFFFFF" stroke="#355EAF" stroke-width="2"/>
  <text x="950" y="462" text-anchor="middle" class="label">Pass?</text>
  <text x="950" y="486" text-anchor="middle" class="body">Verified</text>

  <rect x="1032" y="110" width="112" height="84" rx="20" fill="#ECFDF3" stroke="#2F9C67" stroke-width="2"/>
  <text x="1088" y="154" text-anchor="middle" class="label">Output</text>
  <text x="1088" y="178" text-anchor="middle" class="body">Ship result</text>

  <path d="M1008 270C1080 242 1104 222 1088 194" class="arrow"/>

  <rect x="594" y="458" width="180" height="84" rx="20" fill="#FFF8E8" stroke="#D89A2E" stroke-width="2"/>
  <text x="684" y="502" text-anchor="middle" class="label">Correct</text>
  <text x="684" y="526" text-anchor="middle" class="body">Retry or fallback</text>

  <path d="M860 468H784" class="arrow"/>
  <path d="M594 500C430 500 360 470 360 354" class="arrow"/>

  <text x="92" y="538" class="body">The key loop is not ask → answer. It is plan → act → verify → correct.</text>
</svg>
