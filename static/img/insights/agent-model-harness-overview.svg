<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent equals Model plus Harness overview</title>
  <desc id="desc">Diagram showing a user task flowing through model reasoning into a harness with tools, memory, state, runtime, and recovery, then producing verified output.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1120" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F9FF"/>
      <stop offset="1" stop-color="#F7FBF8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#3A5E9F"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .body { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 24; }
      .pill { stroke-width: 1.5; rx: 16; }
      .arrow { stroke: #3A5E9F; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="40" y="40" width="1120" height="680" rx="36" fill="url(#bg)"/>
  <text x="100" y="118" class="title">Agent = Model + Harness</text>
  <text x="100" y="150" class="subtitle">The model thinks. The harness executes, validates, and recovers.</text>

  <rect x="92" y="248" width="220" height="120" class="box" fill="#FFF8E8" stroke="#E6A63A"/>
  <text x="202" y="300" text-anchor="middle" class="label">User Task</text>
  <text x="202" y="330" text-anchor="middle" class="body">Goal, constraints,</text>
  <text x="202" y="352" text-anchor="middle" class="body">desired outcome</text>

  <rect x="392" y="180" width="250" height="170" class="box" fill="#EAF3FF" stroke="#4F7EC9"/>
  <text x="517" y="240" text-anchor="middle" class="label">Model</text>
  <text x="517" y="274" text-anchor="middle" class="body">Understand intent</text>
  <text x="517" y="298" text-anchor="middle" class="body">Plan next steps</text>
  <text x="517" y="322" text-anchor="middle" class="body">Generate actions</text>

  <rect x="714" y="138" width="364" height="420" class="box" fill="#ECFDF3" stroke="#33A26B"/>
  <text x="896" y="194" text-anchor="middle" class="label">Harness</text>
  <text x="896" y="224" text-anchor="middle" class="body">Engineering layer</text>

  <rect x="752" y="258" width="128" height="64" class="pill" fill="#FFFFFF" stroke="#76B88B"/>
  <text x="816" y="298" text-anchor="middle" class="body">Tools</text>

  <rect x="912" y="258" width="128" height="64" class="pill" fill="#FFFFFF" stroke="#76B88B"/>
  <text x="976" y="298" text-anchor="middle" class="body">Memory</text>

  <rect x="752" y="346" width="128" height="64" class="pill" fill="#FFFFFF" stroke="#76B88B"/>
  <text x="816" y="386" text-anchor="middle" class="body">State</text>

  <rect x="912" y="346" width="128" height="64" class="pill" fill="#FFFFFF" stroke="#76B88B"/>
  <text x="976" y="386" text-anchor="middle" class="body">Runtime</text>

  <rect x="752" y="434" width="288" height="72" class="pill" fill="#FFFFFF" stroke="#76B88B"/>
  <text x="896" y="474" text-anchor="middle" class="body">Validation, guardrails, recovery</text>

  <rect x="812" y="608" width="266" height="84" class="box" fill="#FFF4F4" stroke="#D16C6C"/>
  <text x="945" y="652" text-anchor="middle" class="label">Verified Output</text>
  <text x="945" y="678" text-anchor="middle" class="small">Result plus evidence</text>

  <path d="M312 308H382" class="arrow"/>
  <path d="M642 266H704" class="arrow"/>
  <path d="M896 558V594" class="arrow"/>

  <path d="M816 322V346" class="arrow" opacity="0.45"/>
  <path d="M976 322V346" class="arrow" opacity="0.45"/>
  <path d="M896 410V432" class="arrow" opacity="0.45"/>

  <text x="102" y="622" class="small">A strong model can still fail if the execution layer is weak.</text>
  <text x="102" y="646" class="small">In production, reliability gaps usually appear in the harness first.</text>
</svg>
