<svg width="1200" height="860" viewBox="0 0 1200 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harness capability stack</title>
  <desc id="desc">Stacked diagram of harness capabilities including prompt orchestration, tool router, memory, state machine, runtime sandbox, and guardrails recovery.</desc>
  <defs>
    <linearGradient id="bg2" x1="140" y1="70" x2="1060" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .body { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .note { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect x="40" y="40" width="1120" height="780" rx="36" fill="url(#bg2)"/>
  <text x="100" y="118" class="title">Harness capability stack</text>
  <text x="100" y="150" class="subtitle">A production agent needs more than tools. It needs layered control.</text>

  <rect x="118" y="214" width="684" height="540" rx="30" fill="#FFFFFF" stroke="#C8D8F2" stroke-width="2"/>

  <rect x="160" y="246" width="600" height="74" rx="20" fill="#EAF3FF" stroke="#5B8BD8" stroke-width="2"/>
  <text x="194" y="288" class="section">Prompt orchestration</text>
  <text x="470" y="288" class="body">Roles, objectives, rules, task contracts</text>

  <rect x="160" y="334" width="600" height="74" rx="20" fill="#EEFDF4" stroke="#41A66E" stroke-width="2"/>
  <text x="194" y="376" class="section">Tool router</text>
  <text x="470" y="376" class="body">APIs, MCP, search, files, browser, code execution</text>

  <rect x="160" y="422" width="600" height="74" rx="20" fill="#FFF8E8" stroke="#D89A2E" stroke-width="2"/>
  <text x="194" y="464" class="section">Memory</text>
  <text x="470" y="464" class="body">Short-term context, summaries, long-term preferences</text>

  <rect x="160" y="510" width="600" height="74" rx="20" fill="#F5F3FF" stroke="#8572D6" stroke-width="2"/>
  <text x="194" y="552" class="section">State machine</text>
  <text x="470" y="552" class="body">Stages, retries, waits, ownership, handoff points</text>

  <rect x="160" y="598" width="600" height="74" rx="20" fill="#FFF3F2" stroke="#D56D62" stroke-width="2"/>
  <text x="194" y="640" class="section">Runtime / sandbox</text>
  <text x="470" y="640" class="body">Execution environment, isolation, permissions</text>

  <rect x="160" y="686" width="600" height="74" rx="20" fill="#ECFDF3" stroke="#2F9C67" stroke-width="2"/>
  <text x="194" y="728" class="section">Guardrails / recovery</text>
  <text x="470" y="728" class="body">Validation, approvals, rollback, human takeover</text>

  <rect x="850" y="246" width="250" height="126" rx="24" fill="#FFFFFF" stroke="#D4DDE8" stroke-width="2"/>
  <text x="884" y="286" class="section">Without this layer</text>
  <text x="884" y="318" class="note">The model can suggest actions,</text>
  <text x="884" y="342" class="note">but the system cannot reliably</text>
  <text x="884" y="366" class="note">complete or prove them.</text>

  <rect x="850" y="402" width="250" height="154" rx="24" fill="#FFFFFF" stroke="#D4DDE8" stroke-width="2"/>
  <text x="884" y="442" class="section">Typical failure modes</text>
  <text x="884" y="474" class="note">Invalid tool parameters</text>
  <text x="884" y="500" class="note">Lost task state</text>
  <text x="884" y="526" class="note">Context drift</text>
  <text x="884" y="552" class="note">No recovery path</text>

  <rect x="850" y="588" width="250" height="154" rx="24" fill="#FFFFFF" stroke="#D4DDE8" stroke-width="2"/>
  <text x="884" y="628" class="section">What engineers design</text>
  <text x="884" y="660" class="note">Schemas, checkpoints,</text>
  <text x="884" y="686" class="note">approvals, fallback paths,</text>
  <text x="884" y="712" class="note">evidence and observability</text>
</svg>
